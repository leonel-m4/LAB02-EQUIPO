{% extends "base.html" %}

{% block title %}Registrar Cita - Veterinaria{% endblock %}

{% block content %}

    {% csrf_token %}

    {{ form.as_p }}

</form>

<br>

<a href="{% url 'lista_citas' %}">
    Volver al listado
</a>

{% endblock %}
